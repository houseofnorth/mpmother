; MPMOTHER v1 firmware - Teensy 4.1
; Build: PlatformIO "Build" (checkmark).  Upload: "Upload" (arrow), press the Teensy button if asked.

[env:teensy41]
platform = teensy@5.0.0
board = teensy41
framework = arduino
build_flags = -D USB_MIDI_SERIAL      ; USB shows up as MIDI + serial port
lib_deps = https://github.com/tonton81/WDT_T4.git#1910b57d24468cd3419959118a2e1e6192f5e7fa
monitor_speed = 115200
