<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPMOTHER config</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1c1b19; --muted: #6f6c66; --line: #dedad3;
    --accent: #2f6f5e; --warn: #b4740f; --bad: #b3352b; --track: #e7e3dc; --target: #7c6fd6;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1e1c; --ink: #ecebe6; --muted: #9b988f; --line: #33312d;
            --accent: #5dc4a3; --warn: #e6a640; --bad: #ec6b5e; --track: #2e2c29; --target: #a69cf0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: .04em; margin: 0; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 32px 0 12px; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  select, input[type=number] { font: inherit; padding: 5px 8px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  input[type=number] { width: 70px; font-family: var(--mono); }
  .status { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--track);
         vertical-align: middle; margin-right: 6px; }
  .dot.on { background: var(--accent); }
  .dot.bad { background: var(--bad); }
  .notice { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--warn); color: var(--warn);
            margin-bottom: 16px; }
  .hidden { display: none !important; }

  .knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .knob-head { display: flex; justify-content: space-between; align-items: baseline; }
  .knob-name { font-weight: 600; letter-spacing: .06em; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .pill.user { color: var(--accent); border-color: var(--accent); }
  .pill.follow, .pill.saver { color: var(--target); border-color: var(--target); }
  .pill.fault { color: var(--bad); border-color: var(--bad); }
  .gauge { display: block; width: 150px; height: 130px; margin: 6px auto 0; }
  .gauge .track { stroke: var(--track); }
  .gauge .value { stroke: var(--accent); transition: stroke-dasharray .05s linear; }
  .gauge .target { stroke: var(--target); }
  .gauge text { fill: var(--ink); font: 600 30px var(--mono); }
  .gauge .sub { fill: var(--muted); font: 12px -apple-system, sans-serif; }
  .bars { font: 12px var(--mono); color: var(--muted); display: grid; grid-template-columns: 16px 1fr 38px;
          gap: 4px 8px; align-items: center; margin-top: 6px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > div { height: 100%; background: var(--muted); width: 0; }
  .wear { font-size: 12px; margin-top: 8px; min-height: 18px; color: var(--muted); }
  .wear.warn { color: var(--warn); }
  .wear.bad { color: var(--bad); }
  .drive { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .drive input { width: 100%; accent-color: var(--target); }

  .row { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .field { display: flex; justify-content: space-between; align-items: center; gap: 12px;
           padding: 7px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field label { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 4px; }
  td { padding: 4px; font-family: var(--mono); }
  td input[type=number] { width: 58px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #log { font: 12px/1.6 var(--mono); color: var(--muted); max-height: 160px; overflow: auto;
         white-space: pre-wrap; margin: 0; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>

<header>
  <h1>MPMOTHER</h1>
  <span class="status" id="connection">Not connected</span>
  <span class="spacer"></span>
  <select id="portIn" title="MIDI input"></select>
  <select id="portOut" title="MIDI output"></select>
  <button class="primary" id="connectBtn">Connect</button>
</header>

<div class="notice hidden" id="noMidi">
  This browser can't talk to MIDI devices. Open this page in Chrome or Edge.
</div>

<div class="row status">
  <span><span class="dot" id="dotDrivers"></span><span id="txtDrivers">Drivers –</span></span>
  <span><span class="dot" id="dotIn"></span>MIDI in</span>
  <span><span class="dot" id="dotOut"></span>MIDI out</span>
  <span id="firmware"></span>
</div>

<h2>Knobs</h2>
<div class="knobs" id="knobs"></div>

<h2>Settings</h2>
<div class="settings">
  <div class="card">
    <div class="field"><label for="outChannel">Knobs send on channel</label>
      <input type="number" id="outChannel" min="1" max="16"></div>
    <div class="field"><label for="driveChannel">Ableton drives knobs on channel (0 = off)</label>
      <input type="number" id="driveChannel" min="0" max="16"></div>
    <div class="field"><label for="followFeedback">Follow mapping feedback</label>
      <input type="checkbox" id="followFeedback"></div>
    <div class="field"><label for="dinOut">Also send on DIN socket</label>
      <input type="checkbox" id="dinOut"></div>
  </div>
  <div class="card">
    <div class="field"><label for="maxSpeed">Motor speed (0–127)</label>
      <input type="number" id="maxSpeed" min="0" max="127"></div>
    <div class="field"><label for="saverSpeed">Screensaver speed (0–127)</label>
      <input type="number" id="saverSpeed" min="0" max="127"></div>
    <div class="field"><label for="saverDelay">Screensaver after (seconds, 0 = off)</label>
      <input type="number" id="saverDelay" min="0" max="16383"></div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Knob</th><th>Out CC</th><th>Drive CC</th><th>Calibration</th></tr></thead>
      <tbody id="ccTable"></tbody>
    </table>
  </div>
</div>
<div class="actions">
  <button class="primary" id="saveBtn" disabled>Save to controller</button>
  <button id="reloadBtn" disabled>Reload</button>
  <span class="spacer"></span>
  <button id="clearBtn" disabled>Clear faults</button>
  <button id="calibrateBtn" disabled>Calibrate…</button>
  <button class="danger" id="resetBtn" disabled>Factory reset…</button>
</div>

<h2>Log</h2>
<pre id="log"></pre>

<footer>
  MPMOTHER v1 · House of North ·
  <a href="https://github.com/houseofnorth/mpmother">github.com/houseofnorth/mpmother</a>
</footer>
</main>

<script>
// ---------------------------------------------------------------------------
// Protocol - must match firmware src/midi_io.cpp (see PROTOCOL.md)
// ---------------------------------------------------------------------------
const HEADER = [0xF0, 0x7D, 0x4D, 0x50];
const CMD = { hello: 0x01, getSettings: 0x02, setSettings: 0x03, calibrate: 0x04,
              factoryReset: 0x05, clearFaults: 0x06, monitor: 0x07 };
const REPLY = { hello: 0x41, settings: 0x42, status: 0x43 };

const KNOB_NAMES  = ["SPACE", "TEXTURE", "MOVEMENT", "SHADOW"];
const STATE_NAMES = ["idle", "follow", "user", "saver", "fault"];
const FAULT_NAMES = ["", "Pot gangs disagree", "Wrong direction – calibrate", "Motor not moving"];

const join14 = (hi, lo) => (hi << 7) | lo;
const split14 = v => [(v >> 7) & 0x7F, v & 0x7F];

let midi = null, input = null, output = null;
let settings = null;        // last settings read from the controller
let monitorTimer = null;
const $ = id => document.getElementById(id);

function log(text) {
  const time = new Date().toLocaleTimeString();
  $("log").textContent = `${time}  ${text}\n` + $("log").textContent.slice(0, 4000);
}

function send(command, data = []) {
  if (!output) return;
  output.send([...HEADER, command, ...data.map(b => b & 0x7F), 0xF7]);
}

// ---------------------------------------------------------------------------
// Knob cards
// ---------------------------------------------------------------------------
const ARC = 2 * Math.PI * 52 * 0.75;   // 270° arc length for r = 52

function buildKnobCards() {
  $("knobs").innerHTML = KNOB_NAMES.map((name, k) => `
    <div class="card">
      <div class="knob-head"><span class="knob-name">${name}</span>
        <span class="pill" id="state${k}">–</span></div>
      <svg class="gauge" viewBox="0 0 150 130">
        <g transform="rotate(135 75 70)">
          <circle class="track" cx="75" cy="70" r="52" fill="none" stroke-width="8"
                  stroke-dasharray="${ARC} 999" stroke-linecap="round"/>
          <circle class="value" id="arc${k}" cx="75" cy="70" r="52" fill="none" stroke-width="8"
                  stroke-dasharray="0 999" stroke-linecap="round"/>
          <line class="target hidden" id="target${k}" x1="75" y1="10" x2="75" y2="26" stroke-width="3"
                stroke-linecap="round"/>
        </g>
        <text x="75" y="80" text-anchor="middle" id="cc${k}">–</text>
        <text class="sub" x="75" y="122" text-anchor="middle">CC value</text>
      </svg>
      <div class="bars">
        <span>A</span><div class="bar"><div id="barA${k}"></div></div><span id="valA${k}">–</span>
        <span>B</span><div class="bar"><div id="barB${k}"></div></div><span id="valB${k}">–</span>
      </div>
      <div class="wear" id="wear${k}"></div>
      <div class="drive">Move from here (drive channel)
        <input type="range" min="0" max="127" value="64" id="drive${k}"></div>
    </div>`).join("");

  KNOB_NAMES.forEach((_, k) => {
    $(`drive${k}`).addEventListener("input", e => {
      if (!output || !settings || settings.driveChannel === 0) return;
      const status = 0xB0 | (settings.driveChannel - 1);
      output.send([status, settings.driveCC[k], Number(e.target.value)]);
    });
  });
}

function positionToFraction(k, adc) {
  if (!settings) return adc / 1023;
  const { calLow, calHigh } = settings.cal[k];
  return Math.min(1, Math.max(0, (adc - calLow) / Math.max(1, calHigh - calLow)));
}

function showStatus(d) {
  const awake = d[0] & 1, fault = d[0] & 2, latched = d[0] & 4;
  $("dotDrivers").className = "dot " + (fault ? "bad" : awake ? "on" : "");
  $("txtDrivers").textContent = latched ? "Driver fault – stays off until cleared"
                              : fault ? "Driver fault – retrying" : awake ? "Drivers awake" : "Drivers asleep";
  $("dotIn").className  = "dot " + (d[1] & 1 ? "on" : "");
  $("dotOut").className = "dot " + (d[1] & 2 ? "on" : "");

  for (let k = 0; k < 4; k++) {
    const c = d.slice(2 + 10 * k, 12 + 10 * k);
    const state = STATE_NAMES[c[0]] || "?";
    const worn = c[2] & 1, hasCC = c[2] & 2;
    const a = join14(c[4], c[5]), b = join14(c[6], c[7]), target = join14(c[8], c[9]);

    const pill = $(`state${k}`);
    pill.textContent = state;
    pill.className = "pill " + state;

    $(`cc${k}`).textContent = hasCC ? c[3] : "–";
    $(`arc${k}`).setAttribute("stroke-dasharray", `${ARC * positionToFraction(k, (a + b) / 2)} 999`);

    const targetLine = $(`target${k}`);
    targetLine.classList.toggle("hidden", target === 16383);
    if (target !== 16383) {
      // The tick is drawn at 12 o'clock; the arc starts at 3 o'clock (both inside the rotated group).
      const angle = positionToFraction(k, target) * 270 + 90;
      targetLine.setAttribute("transform", `rotate(${angle} 75 70)`);
    }

    $(`barA${k}`).style.width = `${a / 10.23}%`;  $(`valA${k}`).textContent = a;
    $(`barB${k}`).style.width = `${b / 10.23}%`;  $(`valB${k}`).textContent = b;

    const wear = $(`wear${k}`), diff = Math.abs(a - b);
    if (c[1]) { wear.textContent = FAULT_NAMES[c[1]]; wear.className = "wear bad"; }
    else if (worn) { wear.textContent = `Pot worn – gangs differ by ${diff}`; wear.className = "wear warn"; }
    else { wear.textContent = `Gangs differ by ${diff}`; wear.className = "wear"; }
  }
}

// ---------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------
function parseSettings(d) {
  const s = {
    outChannel: d[0], driveChannel: d[1],
    outCC: d.slice(2, 6), driveCC: d.slice(6, 10),
    followFeedback: !!(d[10] & 1), dinOut: !!(d[10] & 2),
    maxSpeed: d[11], saverSpeed: d[12], saverDelay: join14(d[13], d[14]), cal: [],
  };
  for (let k = 0; k < 4; k++) {
    const c = d.slice(15 + 5 * k, 20 + 5 * k);
    s.cal.push({ calLow: join14(c[0], c[1]), calHigh: join14(c[2], c[3]), reverse: !!c[4] });
  }
  return s;
}

function showSettings(s) {
  $("outChannel").value = s.outChannel;
  $("driveChannel").value = s.driveChannel;
  $("followFeedback").checked = s.followFeedback;
  $("dinOut").checked = s.dinOut;
  $("maxSpeed").value = s.maxSpeed;
  $("saverSpeed").value = s.saverSpeed;
  $("saverDelay").value = s.saverDelay;
  $("ccTable").innerHTML = KNOB_NAMES.map((name, k) => `
    <tr><td>${name}</td>
      <td><input type="number" min="0" max="127" id="outCC${k}" value="${s.outCC[k]}"></td>
      <td><input type="number" min="0" max="127" id="driveCC${k}" value="${s.driveCC[k]}"></td>
      <td>${s.cal[k].calLow}–${s.cal[k].calHigh}${s.cal[k].reverse ? " rev" : ""}</td></tr>`).join("");
}

const clampInput = (id, lo, hi) => Math.min(hi, Math.max(lo, Number($(id).value) || 0));

function settingsFromForm() {
  const delay = clampInput("saverDelay", 0, 16383);
  return [
    clampInput("outChannel", 1, 16),
    clampInput("driveChannel", 0, 16),
    ...[0, 1, 2, 3].map(k => clampInput(`outCC${k}`, 0, 127)),
    ...[0, 1, 2, 3].map(k => clampInput(`driveCC${k}`, 0, 127)),
    ($("followFeedback").checked ? 1 : 0) | ($("dinOut").checked ? 2 : 0),
    clampInput("maxSpeed", 0, 127),
    clampInput("saverSpeed", 0, 127),
    ...split14(delay),
  ];
}

// ---------------------------------------------------------------------------
// MIDI connection
// ---------------------------------------------------------------------------
function onMessage(event) {
  const m = Array.from(event.data);
  if (m[0] !== 0xF0 || !HEADER.every((b, i) => m[i] === b)) return;
  const reply = m[4], data = m.slice(5, -1);
  if (reply === REPLY.hello) {
    $("firmware").textContent = `Firmware ${data[0]}.${data[1]}`;
    log(`Controller answered – firmware ${data[0]}.${data[1]}`);
  } else if (reply === REPLY.settings) {
    settings = parseSettings(data);
    showSettings(settings);
    log("Settings received");
  } else if (reply === REPLY.status) {
    showStatus(data);
  }
}

function listPorts() {
  const fill = (select, ports) => {
    select.innerHTML = "";
    for (const port of ports.values()) {
      const option = new Option(port.name, port.id);
      if (/mpmother/i.test(port.name)) option.selected = true;
      select.add(option);
    }
  };
  fill($("portIn"), midi.inputs);
  fill($("portOut"), midi.outputs);
}

function setConnected(on) {
  ["saveBtn", "reloadBtn", "clearBtn", "calibrateBtn", "resetBtn"].forEach(id => $(id).disabled = !on);
  $("connectBtn").textContent = on ? "Disconnect" : "Connect";
  $("connection").textContent = on ? `Connected to ${output.name}` : "Not connected";
}

function connect() {
  input = midi.inputs.get($("portIn").value);
  output = midi.outputs.get($("portOut").value);
  if (!input || !output) { log("Pick an input and an output first"); return; }
  input.onmidimessage = onMessage;
  setConnected(true);
  send(CMD.hello);
  send(CMD.getSettings);
  send(CMD.monitor);
  monitorTimer = setInterval(() => send(CMD.monitor), 2000);  // keep the status stream alive
}

function disconnect() {
  clearInterval(monitorTimer);
  if (input) input.onmidimessage = null;
  input = output = null;
  setConnected(false);
}

async function start() {
  buildKnobCards();
  if (!navigator.requestMIDIAccess) { $("noMidi").classList.remove("hidden"); return; }
  try {
    midi = await navigator.requestMIDIAccess({ sysex: true });
  } catch (e) {
    $("noMidi").textContent = "MIDI access was refused. Allow MIDI for this page in the browser's site settings.";
    $("noMidi").classList.remove("hidden");
    return;
  }
  listPorts();
  midi.onstatechange = () => {
    listPorts();
    if (output && output.state === "disconnected") { log("Controller unplugged"); disconnect(); }
  };
  if (/mpmother/i.test($("portOut").selectedOptions[0]?.text || "")) connect();
}

$("connectBtn").onclick = () => (output ? disconnect() : connect());
$("saveBtn").onclick = () => { send(CMD.setSettings, settingsFromForm()); log("Settings saved"); };
$("reloadBtn").onclick = () => send(CMD.getSettings);
$("clearBtn").onclick = () => { send(CMD.clearFaults); log("Faults cleared"); };
$("calibrateBtn").onclick = () => {
  if (!confirm("Calibrate? All four knobs will move to both ends. Keep hands off for about 15 seconds.")) return;
  send(CMD.calibrate);
  log("Calibrating – hands off");
};
$("resetBtn").onclick = () => {
  if (!confirm("Reset all settings and calibration to factory defaults?")) return;
  send(CMD.factoryReset);
  log("Factory reset");
};

start();
</script>
</body>
</html>
